repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep close to the ruff that CI installs (>=0.4 unpinned resolves to 0.16.x);
    # a stale pin here makes the hook and CI disagree about formatting.
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
