[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-analytics"
version = "0.1.0"
description = "Match video to tracking, events, and analytics using open-source tools"
readme = "README.md"
# <3.13 because the numpy<2.0 floor (see dependencies) ships no cp313 wheels.
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Fataa Naufal" }]
keywords = ["football", "soccer", "computer-vision", "tracking", "analytics"]

dependencies = [
  # <2.0 is forced by socceraction in the analytics extra. Lifting the cap also drags
  # numba back to a Python<3.10 release, which breaks the cv extra. See docs/licensing.md.
  "numpy>=1.26,<2.0",
  "pandas>=2.1",
  "pyarrow>=15.0",
  "opencv-python-headless>=4.9",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "rich>=13.7",
]

[project.optional-dependencies]
cv = [
  "torch>=2.2",
  "torchvision>=0.17",
  # <0.31 because sv.ByteTrack is removed there. The suggested replacement,
  # ByteTrackTracker from `trackers`, requires numpy>=2.0.2 and so cannot coexist with
  # socceraction (numpy<2.0). Revisit when trackers relaxes that bound.
  "supervision>=0.20,<0.31",
  "transformers>=4.40",
  "scikit-learn>=1.4",
  "umap-learn>=0.5",
]
analytics = [
  "kloppy>=3.15",
  "socceraction>=1.5",
  "mplsoccer>=1.4",
  # floodlight is unsatisfiable alongside socceraction: <0.5 needs pandas<2.0, >=0.5
  # needs numpy>=2.1. Nothing imports it yet. Re-add only if socceraction is dropped.
  "scikit-learn>=1.4",
  "xgboost>=2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
  "pre-commit>=3.7",
  "jupyter>=1.0",
]

[project.scripts]
footy = "footy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["gpu: requires a CUDA device", "slow: full-match duration"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
