[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-analytics"
version = "0.1.0"
description = "Match video to tracking, events, and analytics using open-source tools"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Fataa Naufal" }]
keywords = ["football", "soccer", "computer-vision", "tracking", "analytics"]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15.0",
  "opencv-python-headless>=4.9",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "rich>=13.7",
]

[project.optional-dependencies]
cv = [
  "torch>=2.2",
  "torchvision>=0.17",
  "supervision>=0.20",
  "transformers>=4.40",
  "scikit-learn>=1.4",
  "umap-learn>=0.5",
]
analytics = [
  "kloppy>=3.15",
  "socceraction>=1.5",
  "mplsoccer>=1.4",
  "floodlight>=0.4",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
  "pre-commit>=3.7",
  "jupyter>=1.0",
]

[project.scripts]
footy = "footy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["gpu: requires a CUDA device", "slow: full-match duration"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
